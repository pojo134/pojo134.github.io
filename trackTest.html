<!DOCTYPE html>
<html>
<head>
    <title>Track Generation Test Harness</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            background-color: #1a1a1a;
            color: #ccc;
            margin: 0;
        }
        .panel {
            padding: 15px;
            overflow-y: auto;
            border-right: 1px solid #333;
        }
        #controls {
            width: 300px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        #visualization {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        #trackCanvas {
            border: 1px solid #444;
            background-color: #333333; /* Track surface background */
        }
        #info-debug-panel {
            width: 350px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-group {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #444;
        }
        .control-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .control-group span {
            float: right;
            font-size: 0.9em;
        }
        #debug-console {
            background-color: #000;
            color: #0f0;
            height: 200px;
            overflow-y: scroll;
            padding: 5px;
            white-space: pre-wrap;
            border: 1px solid #444;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .stat-line strong {
            color: #fff;
        }
        .full-width {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #0056b3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .full-width:hover {
            background-color: #004494;
        }
        .error {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="controls" class="panel">
        <h2>Track Parameters</h2>

        <div class="control-group">
            <label for="seed">Seed: <input type="number" id="seed" value="12345" style="width: 100px; float: right;"></label>
            <button id="randomizeSeed" class="full-width" style="margin-top: 5px;">Randomize Seed</button>
        </div>

        <div class="control-group">
            <label for="pointCount">Point Count: <span id="pointCountValue">30</span></label>
            <input type="range" id="pointCount" min="10" max="50" value="30">
        </div>

        <div class="control-group">
            <label for="lloydIterations">Lloyd Iterations: <span id="lloydIterationsValue">10</span></label>
            <input type="range" id="lloydIterations" min="1" max="20" value="10">
        </div>

        <div class="control-group">
            <label for="displacementIterations">Displacement Iterations: <span id="displacementIterationsValue">3</span></label>
            <input type="range" id="displacementIterations" min="1" max="5" value="3">
        </div>

        <div class="control-group">
            <label for="displacementMagnitude">Displacement Magnitude: <span id="displacementMagnitudeValue">100</span></label>
            <input type="range" id="displacementMagnitude" min="10" max="200" value="100">
        </div>

        <div class="control-group">
            <label for="trackWidth">Track Width (m): <span id="trackWidthValue">25</span></label>
            <input type="range" id="trackWidth" min="10" max="50" value="25">
        </div>

        <div class="control-group">
            <label for="samplesPerSegment">Samples Per Segment: <span id="samplesPerSegmentValue">20</span></label>
            <input type="range" id="samplesPerSegment" min="5" max="50" value="20">
        </div>

        <button id="generateTrack" class="full-width">Generate Track</button>
        <button id="downloadJson" class="full-width">Download Track JSON</button>

        <h2>Layers</h2>
        <div id="layerToggles" class="control-group" style="border-bottom: none;">
            <!-- Checkboxes will be inserted here by script -->
        </div>

        <h2>Validation Checklist</h2>
        <div id="validationChecklist" class="control-group" style="border-bottom: none;">
            <div class="stat-line"><input type="checkbox" id="v1" disabled> <label for="v1">Track is a closed loop</label></div>
            <div class="stat-line"><input type="checkbox" id="v2" disabled> <label for="v2">No self-intersections</label></div>
            <div class="stat-line"><input type="checkbox" id="v3" disabled> <label for="v3">All curvature values are finite</label></div>
            <div class="stat-line"><input type="checkbox" id="v4" disabled> <label for="v4">Racing line stays within track boundaries</label></div>
            <div class="stat-line"><input type="checkbox" id="v5" disabled> <label for="v5">Velocity profile has no NaN values</label></div>
            <div class="stat-line"><input type="checkbox" id="v6" disabled> <label for="v6">Lap time is reasonable (30-120s)</label></div>
        </div>
    </div>

    <div id="visualization">
        <canvas id="trackCanvas" width="800" height="600"></canvas>
    </div>

    <div id="info-debug-panel" class="panel">
        <h2>Track Statistics</h2>
        <div id="infoPanel">
            <div class="stat-line">Track Length: <strong id="stat-length">--</strong></div>
            <div class="stat-line">Estimated Lap Time: <strong id="stat-laptime">--</strong></div>
            <div class="stat-line">Max Speed (m/s): <strong id="stat-maxspeed-ms">--</strong></div>
            <div class="stat-line">Max Speed (km/h): <strong id="stat-maxspeed-kmh">--</strong></div>
            <div class="stat-line">Average Speed (km/h): <strong id="stat-avgspeed-kmh">--</strong></div>
            <div class="stat-line">Number of Corners: <strong id="stat-corners">--</strong></div>
            <div class="stat-line">Number of DRS Zones: <strong id="stat-drs">--</strong></div>
            <div class="stat-line">Sector 1 Length: <strong id="stat-sector1">--</strong></div>
            <div class="stat-line">Sector 2 Length: <strong id="stat-sector2">--</strong></div>
            <div class="stat-line">Sector 3 Length: <strong id="stat-sector3">--</strong></div>
        </div>

        <h2>Debug Console</h2>
        <div id="debug-console"></div>
    </div>

    <!-- Script Includes -->
    <script src="trackGenerator.js"></script>
    <script src="racingLineOptimizer.js"></script>
    <script src="trackFeatures.js"></script>
    <script src="trackIntegration.js"></script>
    <script src="verify_integration.js"></script>
    <script>
        // --- Configuration and State ---
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const COLOR_SCHEME = {
            surface: '#333333',
            border: '#ffffff',
            centerline: '#ffff00',
            racingLine: '#00ff00',
            controlPoints: '#0088ff',
            pitLane: '#ff8800',
            drsZone: 'rgba(153, 0, 255, 0.4)', // purple, semi-transparent
            sector1: '#ff0000',
            sector2: '#00ff00',
            sector3: '#0000ff',
            apex: '#ff0000',
            brakingZone: '#ff4444'
        };

        const layers = {
            'controlPoints': { label: 'Control points (blue dots)', default: false },
            'surface': { label: 'Track surface (dark gray)', default: true },
            'borders': { label: 'Borders (white line)', default: true },
            'centerline': { label: 'Centerline (yellow dashed)', default: true },
            'racingLine': { label: 'Racing line (green)', default: true },
            'velocityGradient': { label: 'Velocity (color gradient)', default: false },
            'curvature': { label: 'Curvature (line thickness)', default: false },
            'pitLane': { label: 'Pit lane (orange)', default: false },
            'sectorBoundaries': { label: 'Sector boundaries', default: false },
            'drsZones': { label: 'DRS zones (purple highlight)', default: false },
            'startGrid': { label: 'Start grid', default: false },
            'apexes': { label: 'Apex points (red circles)', default: false },
            'brakingZones': { label: 'Braking zones (red segments)', default: false }
        };

        let currentTrackData = null;
        let currentRacingLineData = null;
        let currentFeatures = null;

        // --- Utility Functions ---

        /**
         * Simple logging function for the debug console.
         * @param {string} message The message to log.
         * @param {boolean} isError If the message is an error.
         */
        function log(message, isError = false) {
            const consoleDiv = document.getElementById('debug-console');
            const span = document.createElement('span');
            span.textContent = `${new Date().toLocaleTimeString()} | ${message}\n`;
            if (isError) span.className = 'error';
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function logError(message) {
            log(message, true);
        }

        function getOptions() {
            return {
                seed: parseInt(document.getElementById('seed').value, 10),
                bounds: { width: CANVAS_WIDTH, height: CANVAS_HEIGHT }, // Inject missing bounds
                pointCount: parseInt(document.getElementById('pointCount').value, 10),
                lloydIterations: parseInt(document.getElementById('lloydIterations').value, 10),
                displacementIterations: parseInt(document.getElementById('displacementIterations').value, 10),
                displacementMagnitude: parseInt(document.getElementById('displacementMagnitude').value, 10),
                trackWidth: parseFloat(document.getElementById('trackWidth').value),
                samplesPerSegment: parseInt(document.getElementById('samplesPerSegment').value, 10),
                // Assume default vehicle and racing line options if not provided by controls
            };
        }

        function getVehicleParams() {
            // Placeholder for real vehicle parameters
            return {
                maxVelocity: 90, // m/s
                maxLateralG: 2.0,
                maxBrakingG: 1.2
            };
        }

        function getRacingLineOptions() {
            // Placeholder for racing line optimization options
            return {
                k1999Iterations: 5,
                maxSegmentSearch: 20
            };
        }

        function getFeatureOptions() {
            // Placeholder for track features options
            return {
                sectorCount: 3,
                minDrsZoneLength: 100,
                maxDrsZoneLength: 500
            };
        }

        function getLayerVisibility() {
            const visibility = {};
            for (const key in layers) {
                visibility[key] = document.getElementById(`layer-${key}`).checked;
            }
            return visibility;
        }

        /**
         * Updates the display of a slider's current value.
         * @param {string} id The id of the input range.
         */
        function updateSliderValue(id) {
            const slider = document.getElementById(id);
            const valueSpan = document.getElementById(`${id}Value`);
            valueSpan.textContent = slider.value;
        }

        /**
         * Interpolates a color between blue and red based on a velocity value.
         * @param {number} velocity Current velocity (m/s).
         * @returns {string} RGB color string.
         */
        function getVelocityColor(velocity) {
            const minV = 20; // m/s (blue)
            const maxV = 90; // m/s (red)
            const v = Math.max(minV, Math.min(maxV, velocity));
            const ratio = (v - minV) / (maxV - minV);

            // Interpolate from blue (0, 0, 255) to green (0, 255, 0) to red (255, 0, 0)
            let r, g, b;

            if (ratio < 0.5) {
                // Blue to Green (0 to 0.5)
                r = 0;
                g = Math.round(255 * (ratio * 2));
                b = Math.round(255 * (1 - ratio * 2));
            } else {
                // Green to Red (0.5 to 1.0)
                r = Math.round(255 * ((ratio - 0.5) * 2));
                g = Math.round(255 * (1 - (ratio - 0.5) * 2));
                b = 0;
            }

            return `rgb(${r}, ${g}, ${b})`;
        }


        // --- Drawing Helper Functions (Simplified for Test Harness) ---

        /**
         * Calculates the scale and offset needed to fit the track bounds into the canvas.
         * @param {object} bounds {minX, maxX, minY, maxY}
         * @param {number} canvasWidth
         * @param {number} canvasHeight
         * @returns {object} {scale, offsetX, offsetY}
         */
        function calculateViewportTransform(bounds, canvasWidth, canvasHeight) {
            if (!bounds || bounds.maxX === undefined) return { scale: 1, offsetX: 0, offsetY: 0 };
            const trackWidth = bounds.maxX - bounds.minX;
            const trackHeight = bounds.maxY - bounds.minY;
            const padding = 50; // pixels of padding

            const scaleX = (canvasWidth - padding * 2) / trackWidth;
            const scaleY = (canvasHeight - padding * 2) / trackHeight;
            const scale = Math.min(scaleX, scaleY);

            // Center the track
            const renderedWidth = trackWidth * scale;
            const renderedHeight = trackHeight * scale;
            const offsetX = (canvasWidth - renderedWidth) / 2 - bounds.minX * scale;
            const offsetY = (canvasHeight - renderedHeight) / 2 - bounds.minY * scale;

            return { scale, offsetX, offsetY };
        }

        /**
         * Draws a line strip from an array of points.
         * @param {CanvasRenderingContext2D} ctx
         * @param {Array<object>} points Array of {x, y} points.
         * @param {boolean} closePath Whether to close the path.
         */
        function drawLineStrip(ctx, points, closePath = false) {
            if (points.length < 2) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            if (closePath) {
                ctx.closePath();
            }
            ctx.stroke();
        }

        function drawTrackSurface(ctx, trackData) {
            if (!trackData.leftBorder || !trackData.rightBorder) return;
            const points = [...trackData.rightBorder, ...trackData.leftBorder.slice().reverse()];
            
            ctx.fillStyle = COLOR_SCHEME.surface;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fill();
        }

        function drawBorders(ctx, trackData) {
            ctx.strokeStyle = COLOR_SCHEME.border;
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.setLineDash([]);

            // Draw Left Border
            drawLineStrip(ctx, trackData.leftBorder, true);

            // Draw Right Border
            drawLineStrip(ctx, trackData.rightBorder, true);
        }

        function drawCenterline(ctx, centerline) {
            ctx.strokeStyle = COLOR_SCHEME.centerline;
            ctx.lineWidth = 1;
            ctx.setLineDash([10, 5]);
            drawLineStrip(ctx, centerline, true);
        }

        function drawRacingLine(ctx, racingLineData) {
            if (!racingLineData.racingLine) return;
            ctx.strokeStyle = COLOR_SCHEME.racingLine;
            ctx.lineWidth = 2;
            ctx.setLineDash([]);
            drawLineStrip(ctx, racingLineData.racingLine.map(p => p.position), true);
        }

        function drawVelocityGradient(ctx, racingLineData) {
            if (!racingLineData.racingLine || racingLineData.racingLine.length < 2) return;
            ctx.lineWidth = 3;
            ctx.setLineDash([]);

            for (let i = 0; i < racingLineData.racingLine.length - 1; i++) {
                const p1 = racingLineData.racingLine[i];
                const p2 = racingLineData.racingLine[i + 1];

                ctx.strokeStyle = getVelocityColor(p1.velocity);
                ctx.beginPath();
                ctx.moveTo(p1.position.x, p1.position.y);
                ctx.lineTo(p2.position.x, p2.position.y);
                ctx.stroke();
            }

            // Close the loop
            const p1 = racingLineData.racingLine[racingLineData.racingLine.length - 1];
            const p2 = racingLineData.racingLine[0];
            ctx.strokeStyle = getVelocityColor(p1.velocity);
            ctx.beginPath();
            ctx.moveTo(p1.position.x, p1.position.y);
            ctx.lineTo(p2.position.x, p2.position.y);
            ctx.stroke();
        }

        function drawCurvatureVisualization(ctx, racingLineData) {
             // Curvature is an approximation here, using a fixed scale for line thickness
            if (!racingLineData.racingLine || racingLineData.racingLine.length < 2) return;
            ctx.strokeStyle = '#fff';
            ctx.setLineDash([]);

            const maxCurvature = racingLineData.racingLine.reduce((max, p) => Math.max(max, Math.abs(p.curvature || 0)), 0);
            
            for (let i = 0; i < racingLineData.racingLine.length - 1; i++) {
                const p1 = racingLineData.racingLine[i];
                const p2 = racingLineData.racingLine[i + 1];
                
                // Scale line width by curvature: small curvature (straight) -> thin line, high curvature (corner) -> thick line
                const curvature = Math.abs(p1.curvature || 0);
                const lineWidth = 1 + (curvature / maxCurvature) * 8; // Max width of 9
                
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.moveTo(p1.position.x, p1.position.y);
                ctx.lineTo(p2.position.x, p2.position.y);
                ctx.stroke();
            }
        }

        function drawControlPoints(ctx, controlPoints) {
            ctx.fillStyle = COLOR_SCHEME.controlPoints;
            controlPoints.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        function drawPitLane(ctx, pitLane) {
            if (!pitLane || !pitLane.entry || !pitLane.exit) return;
            
            ctx.strokeStyle = COLOR_SCHEME.pitLane;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);

            // Pit Lane Centerline (simplistic)
            const entryPoint = pitLane.entry.position;
            const exitPoint = pitLane.exit.position;
            ctx.beginPath();
            ctx.moveTo(entryPoint.x, entryPoint.y);
            // This is complex, so for visualization, we'll draw a straight line
            // In a real implementation, this would trace the pit lane path.
            ctx.lineTo(exitPoint.x, exitPoint.y); 
            ctx.stroke();

            // Reset dash
            ctx.setLineDash([]);
        }

        function drawDRSZones(ctx, trackData, drsZones) {
            if (!drsZones || !drsZones.zones || drsZones.zones.length === 0) return;
            
            ctx.fillStyle = COLOR_SCHEME.drsZone; // semi-transparent purple

            // Helper to get a segment of the track surface (left/right border points)
            const getTrackSegment = (startIdx, endIdx) => {
                const points = [];
                for (let i = startIdx; i !== endIdx; i = (i + 1) % trackData.leftBorder.length) {
                    points.push(trackData.leftBorder[i]);
                }
                points.push(trackData.leftBorder[endIdx]);
                
                const rightPoints = [];
                for (let i = startIdx; i !== endIdx; i = (i + 1) % trackData.rightBorder.length) {
                    rightPoints.push(trackData.rightBorder[i]);
                }
                rightPoints.push(trackData.rightBorder[endIdx]);
                
                return [...points, ...rightPoints.reverse()];
            };

            drsZones.zones.forEach(zone => {
                const startIdx = zone.startIndex;
                const endIdx = zone.endIndex;
                
                // Get the segment of the track outline
                const segmentPoints = getTrackSegment(startIdx, endIdx);

                if (segmentPoints.length < 2) return;
                
                ctx.beginPath();
                ctx.moveTo(segmentPoints[0].x, segmentPoints[0].y);
                for (let i = 1; i < segmentPoints.length; i++) {
                    ctx.lineTo(segmentPoints[i].x, segmentPoints[i].y);
                }
                ctx.closePath();
                ctx.fill();
            });
        }
        
        function drawSectorBoundaries(ctx, trackData, sectors) {
            if (!sectors || !sectors.sectors || sectors.sectors.length === 0) return;

            const centerline = trackData.centerline;
            const leftBorder = trackData.leftBorder;
            const rightBorder = trackData.rightBorder;

            sectors.sectors.forEach((sector, index) => {
                // Only draw the *start* of sectors 2 and 3 (which are the boundaries)
                if (index === 0) return; 

                const boundaryIndex = sector.startIndex;
                const pCenter = centerline[boundaryIndex];
                const pLeft = leftBorder[boundaryIndex];
                const pRight = rightBorder[boundaryIndex];
                
                let color;
                if (index === 1) color = COLOR_SCHEME.sector2; // Boundary between 1 and 2
                else if (index === 2) color = COLOR_SCHEME.sector3; // Boundary between 2 and 3
                else return;
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 10]);

                ctx.beginPath();
                ctx.moveTo(pLeft.x, pLeft.y);
                ctx.lineTo(pRight.x, pRight.y);
                ctx.stroke();
            });

            // Reset dash
            ctx.setLineDash([]);
        }

        function drawStartGrid(ctx, startGrid) {
            if (!startGrid || !startGrid.positions || startGrid.positions.length === 0) return;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            startGrid.positions.forEach((pos, index) => {
                const p = pos.position;
                ctx.save();
                ctx.translate(p.x, p.y);
                
                // Approximate rotation (requires an orientation vector, which we don't have, so assume straight)
                // If the trackData contained a rotation/tangent at this point, we would use it.
                // ctx.rotate(pos.rotation); 
                
                // Draw a simple rectangle for the grid box
                const gridWidth = 10;
                const gridHeight = 20;
                ctx.fillRect(-gridWidth / 2, -gridHeight / 2, gridWidth, gridHeight);
                
                ctx.fillStyle = '#000';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index + 1, 0, 0);

                ctx.restore();
            });
        }

        function drawApexes(ctx, racingLineData) {
            if (!racingLineData.apexes || racingLineData.apexes.length === 0) return;
            ctx.fillStyle = COLOR_SCHEME.apex;
            racingLineData.apexes.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.position.x, p.position.y, 7, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        function drawBrakingZones(ctx, racingLineData) {
            if (!racingLineData.racingLine || racingLineData.racingLine.length < 2) return;
            
            ctx.strokeStyle = COLOR_SCHEME.brakingZone;
            ctx.lineWidth = 4;
            ctx.setLineDash([]);

            for (let i = 0; i < racingLineData.racingLine.length; i++) {
                const p1 = racingLineData.racingLine[i];
                // Assume a braking zone if velocity is significantly decreasing
                // A better approach would rely on a calculated braking flag in racingLineData
                if (p1.velocity < racingLineData.maxVelocity * 0.8 && p1.acceleration < -1.0) {
                     // Draw a small segment for the braking point
                    ctx.beginPath();
                    ctx.arc(p1.position.x, p1.position.y, 2, 0, 2 * Math.PI);
                    ctx.stroke();
                }
            }
        }


        // --- Main Rendering and Logic ---

        function renderTrack(trackData, racingLineData, features, layers) {
            const canvas = document.getElementById('trackCanvas');
            const ctx = canvas.getContext('2d');
            
            if (!trackData || !trackData.bounds) {
                 logError('Track data is incomplete or missing for rendering.');
                 return;
            }

            // Calculate viewport transform (fit track to canvas with padding)
            const transform = calculateViewportTransform(trackData.bounds, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1a1a1a';  // Dark background
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(transform.offsetX, transform.offsetY);
            ctx.scale(transform.scale, transform.scale);
            
            // Draw layers in order (back to front)
            if (layers.surface) drawTrackSurface(ctx, trackData);
            if (layers.pitLane) drawPitLane(ctx, features.pitLane);
            if (layers.drsZones) drawDRSZones(ctx, trackData, features.drsZones);
            if (layers.borders) drawBorders(ctx, trackData);
            if (layers.centerline) drawCenterline(ctx, trackData.centerline);

            if (layers.curvature) drawCurvatureVisualization(ctx, racingLineData);
            if (layers.velocityGradient) drawVelocityGradient(ctx, racingLineData);
            else if (layers.racingLine) drawRacingLine(ctx, racingLineData);
            
            if (layers.sectorBoundaries) drawSectorBoundaries(ctx, trackData, features.sectors);
            if (layers.startGrid) drawStartGrid(ctx, features.startGrid);
            if (layers.controlPoints) drawControlPoints(ctx, trackData.controlPoints);
            if (layers.apexes) drawApexes(ctx, racingLineData);
            if (layers.brakingZones) drawBrakingZones(ctx, racingLineData);
            
            ctx.restore();
            log('Rendering complete.');
        }

        function runGeneration() {
            // Clear previous results
            document.getElementById('debug-console').innerHTML = '';
            document.querySelectorAll('#validationChecklist input[type="checkbox"]').forEach(cb => cb.checked = false);
            
            const startTime = performance.now();
            log('Starting track generation...');
            
            try {
                const options = getOptions();
                
                // Step 1: Generate base track
                const startStep1 = performance.now();
                log('Generating base track...');
                // The global function generateTrack is assumed to be available from trackGenerator.js
                const trackData = generateTrack(options);
                currentTrackData = trackData;
                log(`Track generated: ${trackData.centerline.length} waypoints, ${trackData.trackLength.toFixed(0)}m. (${(performance.now() - startStep1).toFixed(2)}ms)`);
                
                // Step 2: Generate racing line
                const startStep2 = performance.now();
                log('Optimizing racing line...');
                // The global function generateRacingLine is assumed to be available from racingLineOptimizer.js
                const racingLineData = generateRacingLine(trackData, getVehicleParams(), getRacingLineOptions());
                currentRacingLineData = racingLineData;
                log(`Racing line optimized: Lap time ${racingLineData.lapTime.toFixed(3)}s. (${(performance.now() - startStep2).toFixed(2)}ms)`);
                
                // Step 3: Generate features
                const startStep3 = performance.now();
                log('Generating track features...');
                // The global function generateTrackFeatures is assumed to be available from trackFeatures.js
                const features = generateTrackFeatures(trackData, getFeatureOptions());
                currentFeatures = features;
                log(`Features: ${features.sectors.sectors.length} sectors, ${features.drsZones.zones.length} DRS zones. (${(performance.now() - startStep3).toFixed(2)}ms)`);
                
                // Step 4: Render
                log('Rendering...');
                renderTrack(trackData, racingLineData, features, getLayerVisibility());
                
                // Step 5: Update stats & validation
                updateStatistics(trackData, racingLineData, features);
                performValidation(trackData, racingLineData);
                
                const elapsed = performance.now() - startTime;
                log(`Generation complete in ${elapsed.toFixed(2)}ms`);
            } catch (error) {
                logError(`Error: ${error.message}`);
                console.error(error);
                // Clear state on error
                currentTrackData = null;
                currentRacingLineData = null;
                currentFeatures = null;
            }
        }

        function updateStatistics(trackData, racingLineData, features) {
            const lengthMeters = trackData.trackLength || 0;
            const lapTimeSeconds = racingLineData.lapTime || 0;
            const maxSpeedMs = racingLineData.maxVelocity || 0;
            const avgSpeedMs = lengthMeters / lapTimeSeconds || 0;
            const numCorners = racingLineData.apexes ? racingLineData.apexes.length : 0;
            const numDrs = features.drsZones ? features.drsZones.zones.length : 0;
            const sectors = features.sectors ? features.sectors.sectors : [];

            document.getElementById('stat-length').textContent = lengthMeters > 0 ? `${lengthMeters.toFixed(2)} m` : '--';
            document.getElementById('stat-laptime').textContent = lapTimeSeconds > 0 ? `${lapTimeSeconds.toFixed(3)} s` : '--';
            document.getElementById('stat-maxspeed-ms').textContent = maxSpeedMs > 0 ? `${maxSpeedMs.toFixed(2)} m/s` : '--';
            document.getElementById('stat-maxspeed-kmh').textContent = maxSpeedMs > 0 ? `${(maxSpeedMs * 3.6).toFixed(2)} km/h` : '--';
            document.getElementById('stat-avgspeed-kmh').textContent = avgSpeedMs > 0 ? `${(avgSpeedMs * 3.6).toFixed(2)} km/h` : '--';
            document.getElementById('stat-corners').textContent = numCorners;
            document.getElementById('stat-drs').textContent = numDrs;
            document.getElementById('stat-sector1').textContent = sectors[0] && sectors[0].length ? `${sectors[0].length.toFixed(2)} m` : '--';
            document.getElementById('stat-sector2').textContent = sectors[1] && sectors[1].length ? `${sectors[1].length.toFixed(2)} m` : '--';
            document.getElementById('stat-sector3').textContent = sectors[2] && sectors[2].length ? `${sectors[2].length.toFixed(2)} m` : '--';
        }

        function performValidation(trackData, racingLineData) {
            // These checks are placeholders as full implementation is in the external JS files
            
            // v1: Track is a closed loop (checked if start/end points are close)
            const v1 = trackData.isClosedLoop || false;
            document.getElementById('v1').checked = v1;

            // v2: No self-intersections (requires complex geometry check)
            const v2 = trackData.noSelfIntersections || v1; // Assume OK if closed
            document.getElementById('v2').checked = v2;
            
            // v3: All curvature values are finite
            const v3 = racingLineData.racingLine && racingLineData.racingLine.every(p => isFinite(p.curvature || 1));
            document.getElementById('v3').checked = v3;

            // v4: Racing line stays within track boundaries
            // A simple check is hard, rely on a flag from generation
            const v4 = racingLineData.withinBorders || v3; 
            document.getElementById('v4').checked = v4;

            // v5: Velocity profile has no NaN values
            const v5 = racingLineData.racingLine && racingLineData.racingLine.every(p => isFinite(p.velocity || 1));
            document.getElementById('v5').checked = v5;
            
            // v6: Lap time is reasonable (30-120 seconds)
            const v6 = racingLineData.lapTime && racingLineData.lapTime >= 30 && racingLineData.lapTime <= 120;
            document.getElementById('v6').checked = v6;
        }

        function downloadTrackJson() {
            if (!currentTrackData || !currentRacingLineData || !currentFeatures) {
                logError('Cannot download: Track data is not generated yet.');
                return;
            }
            
            const trackJson = {
                track: currentTrackData,
                racingLine: currentRacingLineData,
                features: currentFeatures
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(trackJson, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "generated_track.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            log('Downloading generated_track.json...');
        }


        // --- Initialization and Event Handlers ---

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('trackCanvas');
            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;

            // Initialize slider value displays
            document.querySelectorAll('input[type="range"]').forEach(input => {
                updateSliderValue(input.id);
                input.addEventListener('input', () => updateSliderValue(input.id));
            });

            // Populate layer toggles
            const layerTogglesDiv = document.getElementById('layerToggles');
            for (const key in layers) {
                const layer = layers[key];
                const div = document.createElement('div');
                div.className = 'stat-line';
                div.innerHTML = `
                    <input type="checkbox" id="layer-${key}" ${layer.default ? 'checked' : ''}> 
                    <label for="layer-${key}">${layer.label}</label>
                `;
                layerTogglesDiv.appendChild(div);

                // Add event listener to re-render when a layer is toggled
                document.getElementById(`layer-${key}`).addEventListener('change', () => {
                    if (currentTrackData) {
                        log('Layer visibility changed, re-rendering...');
                        renderTrack(currentTrackData, currentRacingLineData, currentFeatures, getLayerVisibility());
                    }
                });
            }

            // Event Listeners for buttons
            document.getElementById('generateTrack').addEventListener('click', runGeneration);
            document.getElementById('downloadJson').addEventListener('click', downloadTrackJson);
            document.getElementById('randomizeSeed').addEventListener('click', () => {
                const newSeed = Math.floor(Math.random() * 1000000);
                document.getElementById('seed').value = newSeed;
                log(`Seed randomized to ${newSeed}`);
            });
            
            // Run initial generation on load
            runGeneration();

            // Run integration test
            testTrackIntegration();
        });

    </script>
</body>
</html>
