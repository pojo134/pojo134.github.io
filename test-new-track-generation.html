<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Generation Test Suite</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #e0e0e0;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #ff4444;
            margin-bottom: 30px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: bold;
            color: #ff4444;
        }
        button {
            padding: 12px 24px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        button:hover {
            background: #ff6666;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .track-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .track-card h3 {
            margin: 0 0 10px 0;
            color: #ff4444;
            font-size: 18px;
        }
        .track-canvas {
            width: 100%;
            height: 300px;
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .track-stats {
            font-size: 14px;
            line-height: 1.6;
        }
        .track-stats div {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #333;
        }
        .track-stats div:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #aaa;
        }
        .stat-value {
            color: #fff;
            font-weight: bold;
        }
        .test-results {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .test-results h2 {
            color: #ff4444;
            margin-top: 0;
        }
        .test-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .test-pass {
            background: rgba(0, 255, 0, 0.1);
            border-left: 4px solid #00ff00;
        }
        .test-fail {
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #ff0000;
        }
        .test-warning {
            background: rgba(255, 165, 0, 0.1);
            border-left: 4px solid #ffa500;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-pass {
            background: #00ff00;
            color: #000;
        }
        .status-fail {
            background: #ff0000;
            color: #fff;
        }
        .status-warning {
            background: #ffa500;
            color: #000;
        }
        .progress-bar {
            width: 100%;
            height: 30px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff6666);
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .league-settings {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
        }
        .error-details {
            background: #4a0000;
            padding: 10px;
            margin-top: 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Track Generation Test Suite</h1>

        <div class="controls">
            <div class="control-group">
                <label for="leagueSelect">League Type:</label>
                <select id="leagueSelect" style="padding: 8px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">
                    <option value="1">Go-Kart (Tier 1)</option>
                    <option value="2">GT (Tier 2)</option>
                    <option value="3">Open Wheel (Tier 3)</option>
                    <option value="4">LM (Tier 4)</option>
                    <option value="stock">Stock Car</option>
                </select>
            </div>
            <div class="control-group">
                <button id="generateSingleBtn">Generate Single Track</button>
            </div>
            <div class="control-group">
                <button id="generateBatchBtn">Generate 10 Tracks (Test)</button>
            </div>
            <div class="control-group">
                <button id="runFullTestBtn">Run Full Test Suite</button>
            </div>
        </div>

        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
        </div>

        <div class="test-results" id="testResults" style="display: none;">
            <h2>Test Results</h2>
            <div id="testOutput"></div>
        </div>

        <div class="track-grid" id="trackGrid"></div>
    </div>

    <script type="module">
        import { TrackGenerator } from './src/systems/generators.js';
        import Track from './src/models/track.js';

        const trackGen = new TrackGenerator();
        const trackGrid = document.getElementById('trackGrid');
        const testResults = document.getElementById('testResults');
        const testOutput = document.getElementById('testOutput');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        // League configurations
        const leagueConfigs = {
            '1': { name: 'Go-Kart', tier: 1, trackTypes: ['Go-Kart Track', 'Short Oval'] },
            '2': { name: 'GT', tier: 2, trackTypes: ['Short Oval', 'Dirt Oval', 'Road Course', 'Oval'] },
            '3': { name: 'Open Wheel', tier: 3, trackTypes: ['Oval', 'Tri-Oval', 'Road Course (Technical)', 'Street Circuit', 'Superspeedway'], ovalChance: 0.05 },
            '4': { name: 'LM', tier: 4, trackTypes: ['Superspeedway', 'Road Course (Technical)', 'Street Circuit', 'Tri-Oval'] },
            'stock': { name: 'Stock Car', tier: 2, ovalOnly: true, trackTypes: ['Oval', 'Tri-Oval', 'Short Oval', 'Superspeedway'] }
        };

        // Generate and display a track
        function generateAndDisplayTrack(leagueTier, trackType = null) {
            const startTime = performance.now();

            try {
                const track = trackGen.generateTrack(trackType, 8000, 6000, {}, leagueTier);
                const generationTime = performance.now() - startTime;

                // Validate track
                const validation = validateTrack(track);

                displayTrack(track, generationTime, validation, leagueTier);

                return { track, generationTime, validation };
            } catch (error) {
                console.error('Track generation failed:', error);
                return { error: error.message };
            }
        }

        // Validate a track
        function validateTrack(track) {
            const issues = [];
            const warnings = [];

            // Check waypoints exist
            if (!track.waypoints || track.waypoints.length === 0) {
                issues.push('No waypoints generated');
                return { valid: false, issues, warnings };
            }

            // Check waypoint count is reasonable
            if (track.waypoints.length < 10) {
                warnings.push(`Low waypoint count: ${track.waypoints.length}`);
            }

            // Check for NaN or invalid coordinates
            for (let i = 0; i < track.waypoints.length; i++) {
                const wp = track.waypoints[i];
                if (isNaN(wp.x) || isNaN(wp.y) || !isFinite(wp.x) || !isFinite(wp.y)) {
                    issues.push(`Invalid waypoint at index ${i}: (${wp.x}, ${wp.y})`);
                }
            }

            // Check bounds (should be within reasonable range)
            const bounds = track.visualBounds;
            if (bounds.width > 20000 || bounds.height > 20000) {
                warnings.push(`Large track bounds: ${bounds.width.toFixed(0)}x${bounds.height.toFixed(0)}`);
            }

            // Check for self-intersections (simplified check)
            const selfIntersections = checkSelfIntersections(track.waypoints);
            if (selfIntersections > 0) {
                warnings.push(`Potential self-intersections detected: ${selfIntersections}`);
            }

            // Check total distance
            if (track.totalDistance < 100) {
                issues.push(`Track too short: ${track.totalDistance.toFixed(0)} units`);
            }

            return {
                valid: issues.length === 0,
                issues,
                warnings
            };
        }

        // Simplified self-intersection check
        function checkSelfIntersections(waypoints) {
            if (waypoints.length < 4) return 0;

            let intersectionCount = 0;

            for (let i = 0; i < waypoints.length - 1; i++) {
                const p1 = waypoints[i];
                const p2 = waypoints[(i + 1) % waypoints.length];

                // Check against non-adjacent segments (skip 2 to avoid corner detection)
                for (let j = i + 3; j < waypoints.length - 1; j++) {
                    const p3 = waypoints[j];
                    const p4 = waypoints[(j + 1) % waypoints.length];

                    if (lineSegmentsIntersect(p1, p2, p3, p4)) {
                        intersectionCount++;
                    }
                }
            }

            return intersectionCount;
        }

        // Line segment intersection test
        function lineSegmentsIntersect(p1, p2, p3, p4) {
            const det = (p2.x - p1.x) * (p4.y - p3.y) - (p4.x - p3.x) * (p2.y - p1.y);
            if (Math.abs(det) < 0.0001) return false;

            const t = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / det;
            const u = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / det;

            return t > 0.01 && t < 0.99 && u > 0.01 && u < 0.99;
        }

        // Display a track on canvas
        function displayTrack(track, generationTime, validation, leagueTier) {
            const card = document.createElement('div');
            card.className = 'track-card';

            const title = document.createElement('h3');
            title.textContent = `${track.name} (${track.type})`;
            card.appendChild(title);

            const canvas = document.createElement('canvas');
            canvas.className = 'track-canvas';
            canvas.width = 800;
            canvas.height = 600;
            card.appendChild(canvas);

            // Draw track
            renderTrack(canvas, track);

            // Stats
            const stats = document.createElement('div');
            stats.className = 'track-stats';

            const leagueConfig = Object.values(leagueConfigs).find(c => c.tier === leagueTier) || leagueConfigs['2'];

            stats.innerHTML = `
                <div><span class="stat-label">League:</span><span class="stat-value">${leagueConfig.name}</span></div>
                <div><span class="stat-label">Type:</span><span class="stat-value">${track.type}</span></div>
                <div><span class="stat-label">Waypoints:</span><span class="stat-value">${track.waypoints.length}</span></div>
                <div><span class="stat-label">Distance:</span><span class="stat-value">${track.totalDistance.toFixed(0)} units</span></div>
                <div><span class="stat-label">Complexity:</span><span class="stat-value">${track.characteristics.technicalDifficulty || 'N/A'}</span></div>
                <div><span class="stat-label">Turn Count:</span><span class="stat-value">${track.characteristics.turnCount || 0}</span></div>
                <div><span class="stat-label">Generation Time:</span><span class="stat-value">${generationTime.toFixed(2)}ms</span></div>
                <div><span class="stat-label">Weather:</span><span class="stat-value">${track.weather.type || 'Clear'}</span></div>
                <div><span class="stat-label">Validation:</span><span class="stat-value ${validation.valid ? 'status-pass' : 'status-fail'}">${validation.valid ? 'PASS' : 'FAIL'}</span></div>
            `;

            if (validation.warnings.length > 0) {
                const warnings = document.createElement('div');
                warnings.className = 'league-settings';
                warnings.innerHTML = '<strong>Warnings:</strong><br>' + validation.warnings.join('<br>');
                stats.appendChild(warnings);
            }

            if (!validation.valid) {
                const errors = document.createElement('div');
                errors.className = 'error-details';
                errors.innerHTML = '<strong>Errors:</strong><br>' + validation.issues.join('<br>');
                stats.appendChild(errors);
            }

            card.appendChild(stats);
            trackGrid.insertBefore(card, trackGrid.firstChild);
        }

        // Render track on canvas
        function renderTrack(canvas, track) {
            const ctx = canvas.getContext('2d');
            const bounds = track.visualBounds;

            // Clear canvas
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!track.waypoints || track.waypoints.length === 0) return;

            // Scale to fit canvas with padding
            const padding = 40;
            const scaleX = (canvas.width - 2 * padding) / bounds.width;
            const scaleY = (canvas.height - 2 * padding) / bounds.height;
            const scale = Math.min(scaleX, scaleY);

            // Center the track
            const offsetX = (canvas.width - bounds.width * scale) / 2 - bounds.minX * scale;
            const offsetY = (canvas.height - bounds.height * scale) / 2 - bounds.minY * scale;

            // Transform function
            const transform = (x, y) => ({
                x: x * scale + offsetX,
                y: y * scale + offsetY
            });

            // Draw track
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 3;
            ctx.beginPath();

            const first = transform(track.waypoints[0].x, track.waypoints[0].y);
            ctx.moveTo(first.x, first.y);

            for (let i = 1; i < track.waypoints.length; i++) {
                const pt = transform(track.waypoints[i].x, track.waypoints[i].y);
                ctx.lineTo(pt.x, pt.y);
            }

            ctx.closePath();
            ctx.stroke();

            // Draw racing line (brighter)
            ctx.strokeStyle = '#ff4444';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw waypoints
            ctx.fillStyle = '#ffff00';
            for (let i = 0; i < track.waypoints.length; i++) {
                const pt = transform(track.waypoints[i].x, track.waypoints[i].y);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw start/finish line
            if (track.waypoints.length > 1) {
                const start = transform(track.waypoints[0].x, track.waypoints[0].y);
                const next = transform(track.waypoints[1].x, track.waypoints[1].y);

                const dx = next.x - start.x;
                const dy = next.y - start.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                const perpX = -dy / len * 20;
                const perpY = dx / len * 20;

                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(start.x - perpX, start.y - perpY);
                ctx.lineTo(start.x + perpX, start.y + perpY);
                ctx.stroke();
            }
        }

        // Update progress bar
        function updateProgress(current, total) {
            const percent = Math.round((current / total) * 100);
            progressFill.style.width = percent + '%';
            progressFill.textContent = percent + '%';
        }

        // Run full test suite
        async function runFullTestSuite() {
            testResults.style.display = 'block';
            progressBar.style.display = 'block';
            testOutput.innerHTML = '<p>Running comprehensive test suite...</p>';
            trackGrid.innerHTML = '';

            const results = {
                total: 0,
                passed: 0,
                failed: 0,
                warnings: 0,
                tests: []
            };

            const testsToRun = [
                { name: 'Go-Kart League (10 tracks)', tier: 1, count: 10 },
                { name: 'GT League (10 tracks)', tier: 2, count: 10 },
                { name: 'Open Wheel League (20 tracks - test oval chance)', tier: 3, count: 20 },
                { name: 'LM League (10 tracks)', tier: 4, count: 10 },
                { name: 'Stock Car (10 tracks - oval only)', tier: 'stock', count: 10 }
            ];

            let totalTracks = testsToRun.reduce((sum, test) => sum + test.count, 0);
            let processedTracks = 0;

            for (const test of testsToRun) {
                const testResult = {
                    name: test.name,
                    passed: 0,
                    failed: 0,
                    avgTime: 0,
                    issues: [],
                    ovalCount: 0
                };

                let totalTime = 0;

                for (let i = 0; i < test.count; i++) {
                    const tier = test.tier === 'stock' ? 2 : test.tier;
                    const result = generateAndDisplayTrack(tier);

                    processedTracks++;
                    updateProgress(processedTracks, totalTracks);

                    if (result.error) {
                        testResult.failed++;
                        testResult.issues.push(result.error);
                    } else {
                        totalTime += result.generationTime;

                        if (result.validation.valid) {
                            testResult.passed++;
                        } else {
                            testResult.failed++;
                            testResult.issues.push(...result.validation.issues);
                        }

                        // Count ovals for Open Wheel test
                        if (test.tier === 3 && (result.track.type.includes('Oval') || result.track.type.includes('Tri-Oval'))) {
                            testResult.ovalCount++;
                        }

                        // Check Stock Car only generates ovals
                        if (test.tier === 'stock' && !result.track.type.includes('Oval')) {
                            testResult.failed++;
                            testResult.issues.push(`Stock Car generated non-oval: ${result.track.type}`);
                        } else if (test.tier === 'stock' && result.track.type.includes('Oval')) {
                            testResult.ovalCount++;
                        }
                    }

                    // Small delay to prevent UI freezing
                    await new Promise(resolve => setTimeout(resolve, 10));
                }

                testResult.avgTime = totalTime / test.count;
                results.tests.push(testResult);
                results.total += test.count;
                results.passed += testResult.passed;
                results.failed += testResult.failed;
            }

            // Display results
            displayTestResults(results);
        }

        // Display test results
        function displayTestResults(results) {
            let html = `<h3>Summary: ${results.passed}/${results.total} tracks passed validation</h3>`;

            for (const test of results.tests) {
                const status = test.failed === 0 ? 'test-pass' : 'test-fail';
                const statusBadge = test.failed === 0 ? 'status-pass' : 'status-fail';

                html += `
                    <div class="${status}">
                        <div>
                            <strong>${test.name}</strong><br>
                            Passed: ${test.passed}, Failed: ${test.failed}<br>
                            Avg Generation Time: ${test.avgTime.toFixed(2)}ms
                            ${test.ovalCount > 0 ? `<br>Oval Tracks: ${test.ovalCount}` : ''}
                        </div>
                        <span class="status-badge ${statusBadge}">${test.failed === 0 ? 'PASS' : 'FAIL'}</span>
                    </div>
                `;

                if (test.issues.length > 0) {
                    html += `<div class="error-details">Issues: ${test.issues.join(', ')}</div>`;
                }
            }

            // Performance check
            const avgTime = results.tests.reduce((sum, test) => sum + test.avgTime, 0) / results.tests.length;
            const perfStatus = avgTime < 1000 ? 'test-pass' : 'test-fail';
            const perfBadge = avgTime < 1000 ? 'status-pass' : 'status-fail';

            html += `
                <div class="${perfStatus}">
                    <div>
                        <strong>Performance Test</strong><br>
                        Average generation time: ${avgTime.toFixed(2)}ms<br>
                        Target: < 1000ms
                    </div>
                    <span class="status-badge ${perfBadge}">${avgTime < 1000 ? 'PASS' : 'FAIL'}</span>
                </div>
            `;

            // Open Wheel oval chance check
            const openWheelTest = results.tests.find(t => t.name.includes('Open Wheel'));
            if (openWheelTest) {
                const ovalPercent = (openWheelTest.ovalCount / 20) * 100;
                const ovalStatus = ovalPercent >= 3 && ovalPercent <= 10 ? 'test-pass' : 'test-warning';
                const ovalBadge = ovalPercent >= 3 && ovalPercent <= 10 ? 'status-pass' : 'status-warning';

                html += `
                    <div class="${ovalStatus}">
                        <div>
                            <strong>Open Wheel Oval Chance Test</strong><br>
                            Generated ${openWheelTest.ovalCount}/20 oval tracks (${ovalPercent.toFixed(1)}%)<br>
                            Target: ~5% (1-2 tracks)
                        </div>
                        <span class="status-badge ${ovalBadge}">${ovalPercent >= 3 && ovalPercent <= 10 ? 'PASS' : 'MARGINAL'}</span>
                    </div>
                `;
            }

            // Stock Car oval-only check
            const stockCarTest = results.tests.find(t => t.name.includes('Stock Car'));
            if (stockCarTest) {
                const allOvalsStatus = stockCarTest.ovalCount === 10 ? 'test-pass' : 'test-fail';
                const allOvalsBadge = stockCarTest.ovalCount === 10 ? 'status-pass' : 'status-fail';

                html += `
                    <div class="${allOvalsStatus}">
                        <div>
                            <strong>Stock Car Oval-Only Test</strong><br>
                            Generated ${stockCarTest.ovalCount}/10 oval tracks<br>
                            Target: 100% ovals
                        </div>
                        <span class="status-badge ${allOvalsBadge}">${stockCarTest.ovalCount === 10 ? 'PASS' : 'FAIL'}</span>
                    </div>
                `;
            }

            testOutput.innerHTML = html;
        }

        // Event listeners
        document.getElementById('generateSingleBtn').addEventListener('click', () => {
            const leagueTier = document.getElementById('leagueSelect').value;
            const tier = leagueTier === 'stock' ? 2 : parseInt(leagueTier);
            generateAndDisplayTrack(tier);
        });

        document.getElementById('generateBatchBtn').addEventListener('click', async () => {
            const leagueTier = document.getElementById('leagueSelect').value;
            const tier = leagueTier === 'stock' ? 2 : parseInt(leagueTier);

            progressBar.style.display = 'block';

            for (let i = 0; i < 10; i++) {
                generateAndDisplayTrack(tier);
                updateProgress(i + 1, 10);
                await new Promise(resolve => setTimeout(resolve, 50));
            }

            setTimeout(() => {
                progressBar.style.display = 'none';
            }, 1000);
        });

        document.getElementById('runFullTestBtn').addEventListener('click', runFullTestSuite);

        // Generate initial track on load
        window.addEventListener('load', () => {
            generateAndDisplayTrack(2); // GT track
        });
    </script>
</body>
</html>
